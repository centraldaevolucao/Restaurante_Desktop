# Compila Windows e Linux a cada tag vX.Y.Z e anexa os arquivos à release.
name: build
on:
  push:
    tags: ["v*"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: empacotar\build-windows.bat
        shell: cmd
      - run: choco install innosetup -y
      - run: iscc empacotar\instalador.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: saida/*.exe }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: bash empacotar/build-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "*.tar.gz" }
