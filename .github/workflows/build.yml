# Compila Windows e Linux. Roda: ao enviar para a branch main, ao criar uma tag vX.Y.Z (e publica a release) e manualmente (aba Actions → build → Run workflow).
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller
      - name: Gerar Restaurante.exe
        run: python -m PyInstaller --noconfirm --clean --name Restaurante --add-data "nucleo;nucleo" --paths nucleo --hidden-import server --hidden-import licenca --hidden-import backup_comandas --hidden-import impressao --hidden-import tunel --hidden-import sqlite3 restaurante_desktop.py
        shell: pwsh
      - name: Conferir saída
        run: |
          if (-not (Test-Path dist\Restaurante\Restaurante.exe)) { throw "Restaurante.exe não foi gerado" }
          Get-ChildItem dist\Restaurante | Select-Object -First 5
        shell: pwsh
      - name: Gerar instalador
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado" }
          & $iscc.FullName empacotar\instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou ($LASTEXITCODE)" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: saida/*.exe }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: bash empacotar/build-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "*.tar.gz" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: pacotes }
      - uses: softprops/action-gh-release@v2
        with: { files: "pacotes/**/*" }
